<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ks-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="ks-bottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- KaamSetu Navy rounded squircle -->
  <rect width="64" height="64" rx="14.5" fill="#172554" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- KaamSetu 'K' Logo Mark -->
  <g>
    <!-- Left vertical stem -->
    <rect x="14.5" y="13" width="8.5" height="38" rx="4.25" fill="#f59e0b" />

    <!-- Top diagonal arm -->
    <line x1="24" y1="32" x2="45" y2="17" stroke="url(#ks-top)" stroke-width="8.5" stroke-linecap="round" />

    <!-- Bottom diagonal arm -->
    <line x1="24" y1="32" x2="45" y2="47" stroke="url(#ks-bottom)" stroke-width="8.5" stroke-linecap="round" />

    <!-- Center joint blend -->
    <circle cx="24" cy="32" r="4.25" fill="#f59e0b" />
  </g>
</svg>
